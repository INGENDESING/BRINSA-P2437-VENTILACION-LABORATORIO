# =====================================================================
# BASES DE DISEÑO — Fuente única de verdad
# Proyecto: P2437-HV-INF-001 — Sistema de ventilación y presurización
# Cliente: BRINSA
# =====================================================================

proyecto:
  codigo: "P2437-HV-INF-001"
  nombre: "Diseño del sistema de ventilación y presurización del laboratorio"
  cliente: "BRINSA"
  revision: "0"
  fecha_emision: "2026-07-15"

# ---------------------------------------------------------------------
# Condiciones del recinto
# ---------------------------------------------------------------------
recinto:
  volumen_efectivo_m3: 320.0
  renovaciones_aire_h: 12.0
  presion_diferencial_objetivo_Pa: 25.0
  presion_diferencial_minima_Pa: 12.5
  estrategia: "Ventilador de impulsión directa + rejillas de exfiltración controladas"

# ---------------------------------------------------------------------
# Condiciones ambientales del sitio (valores típicos Valle del Cauca)
# ---------------------------------------------------------------------
ambiente:
  temperatura_ambiente_max_C: 35.0
  temperatura_ambiente_min_C: 18.0
  temperatura_ambiente_promedio_C: 26.5
  humedad_relativa_max_pct: 90.0
  humedad_relativa_min_pct: 60.0
  presion_atmosferica_kPa: 101.3
  altitud_msnm: 960.0

# ---------------------------------------------------------------------
# Aire de proceso / ventilación
# ---------------------------------------------------------------------
aire:
  densidad_kg_m3: 1.2
  viscosidad_dinamica_Pa_s: 1.81e-5
  temperatura_impulsion_C: 25.0
  calidad_objetivo: "Filtración MERV 13-14 mínimo; HEPA H13/H14 según riesgo biológico"

# ---------------------------------------------------------------------
# Criterios de diseño del ventilador
# ---------------------------------------------------------------------
ventilador:
  caudal_m3_min: 64.0
  caudal_m3_h: 3840.0
  caudal_cfm: 2260.1
  presion_total_Pa: 250.0
  eficiencia_total: 0.60
  velocidad_boca_m_s: 8.0
  area_boca_m2: 0.1333
  diametro_equivalente_mm: 412.0
  radio_equivalente_mm: 206.0
  potencia_teorica_kW: 0.444
  potencia_teorica_HP: 0.596
  potencia_instalada_HP: 1.0

# ---------------------------------------------------------------------
# Criterios de diseño de rejillas de exfiltración
# ---------------------------------------------------------------------
rejillas_exfiltracion:
  numero: 3
  velocidad_facial_m_s: 3.0
  area_neta_total_m2: 0.3556
  area_neta_por_rejilla_m2: 0.1185
  altura_mm: 353.2
  ancho_mm: 335.5
  proporcion_ancho_alto: 0.95

# ---------------------------------------------------------------------
# Normas aplicables vigentes
# ---------------------------------------------------------------------
normas:
  - codigo: "ASHRAE 170"
    edicion: "2021"
    alcance: "Ventilation of Health Care Facilities"
  - codigo: "ASHRAE 62.1"
    edicion: "2022"
    alcance: "Ventilation for Acceptable Indoor Air Quality"
  - codigo: "NFPA 99"
    edicion: "2021"
    alcance: "Health Care Facilities Code"
  - codigo: "OSHA 29 CFR 1910.1450"
    edicion: "2012"
    alcance: "Occupational Exposure to Hazardous Chemicals in Laboratories"
  - codigo: "WHO Laboratory Biosafety Manual"
    edicion: "2004"
    alcance: "Recomendaciones de renovaciones de aire para laboratorios BSL-2 y BSL-3"
  - codigo: "NIH DRM"
    edicion: "2023"
    alcance: "Design Requirements Manual"

[project]
name = "plantilla-dml"
version = "0.1.0"
description = "Plantilla MASTER de proyectos de ingeniería química DML."
requires-python = ">=3.11,<3.13"
dependencies = [
    "coolprop>=6.6.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "plotly>=5.20",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "pint>=0.24",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "jupyterlab>=4.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["01_calculos/tests"]
pythonpath = ["01_calculos"]

[tool.uv]
package = false

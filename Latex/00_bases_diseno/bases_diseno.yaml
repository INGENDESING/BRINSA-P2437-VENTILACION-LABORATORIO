# =====================================================================
# BASES DE DISEÑO — Fuente única de verdad
# Proyecto: P2437-HV-INF-001 — Sistema de ventilación del laboratorio
# Cliente: BRINSA
# Actualizado 2026-07-27 (REV2) — uniformidad con montaje típico de planta:
# ventilador axial MURAL (placa mural) Ø560 mm, transmisión directa,
# filtración en cubierta intemperie, estructura de unión, malla de
# protección interior (fuente: Montaje/DISENOFINAL.png).
# (REV1: SIN presurización, ventilador AXIAL, sin instrumentación ΔP ni
# damper de alivio. Se mantienen caudal, filtración MERV y rejillas.)
# Sitio real Cajicá, Cundinamarca (2 558 msnm), ρ = 0.88 kg/m³; sin HEPA
# =====================================================================

proyecto:
  codigo: "P2437-HV-INF-001"
  nombre: "Diseño del sistema de ventilación del laboratorio"
  cliente: "BRINSA"
  revision: "2"
  fecha_emision: "2026-07-27"

# ---------------------------------------------------------------------
# Condiciones del recinto
# ---------------------------------------------------------------------
recinto:
  volumen_efectivo_m3: 320.0
  renovaciones_aire_h: 12.0
  coeficiente_descarga_orificio_Cd: 0.60             # orificio borde afilado, ASHRAE Handbook Fundamentals (pérdida en rejillas)
  estrategia: "Ventilador axial de impulsión directa + rejillas de exfiltración con descarga libre a atmósfera (sin control de presurización)"

# ---------------------------------------------------------------------
# Condiciones ambientales del sitio (Cajicá, Cundinamarca — 2 558 msnm)
# ---------------------------------------------------------------------
ambiente:
  sitio: "Cajicá, Cundinamarca"
  entorno: "Planta de hipoclorito de calcio — ambiente altamente corrosivo"
  temperatura_ambiente_max_C: 21.0
  temperatura_ambiente_min_C: 3.0
  temperatura_ambiente_promedio_C: 14.0
  humedad_relativa_max_pct: 89.0
  humedad_relativa_media_pct: 84.0
  presion_atmosferica_kPa: 74.1
  altitud_msnm: 2558.0

# ---------------------------------------------------------------------
# Aire de proceso / ventilación
# ---------------------------------------------------------------------
aire:
  densidad_kg_m3: 0.88          # a 20 °C, Cajicá 2 558 msnm (P_atm = 74.1 kPa)
  viscosidad_dinamica_Pa_s: 1.81e-5
  temperatura_impulsion_C: 21.0     # condición de diseño de verano 0.4 % (coherente con rho = 0.88 kg/m³)
  calidad_objetivo: "Filtración MERV 13-14 definitiva — laboratorio de análisis industrial; NO requiere HEPA"

# ---------------------------------------------------------------------
# Criterios de diseño del ventilador
# ---------------------------------------------------------------------
ventilador:
  tipo: "Axial mural (placa mural) anticorrosivo PRFV o epóxico, transmisión directa"   # REV2: uniformidad montaje típico de planta (Montaje/DISENOFINAL.png)
  diametro_seleccionado_mm: 560.0   # Ø560 mm (22 in) — tamaño uniforme de planta (REV2)
  montaje: "Mural en pasamuros con estructura de unión pernada al muro; cubierta intemperie que aloja el banco de filtración (MERV 8 + MERV 13-14); malla de protección interior en la descarga; cota ~3,0 m sobre piso"
  caudal_m3_min: 64.0
  caudal_m3_h: 3840.0
  caudal_cfm: 2260.1
  presion_total_Pa: 165.0
  eficiencia_total: 0.55          # provisional típico axial; confirmar con curva del fabricante seleccionado
  velocidad_boca_m_s: 8.0         # condición de contorno del modelo CFD (referencia histórica)
  area_boca_m2: 0.1333
  diametro_equivalente_mm: 412.0  # BC del CFD (referencia histórica); la descarga real es Ø560 mm
  radio_equivalente_mm: 206.0
  area_boca_real_m2: 0.2463       # π × 0.28², impulsor Ø560 mm (REV2)
  velocidad_boca_real_m_s: 4.33   # Q / A_boca real = 1.0667 / 0.2463 (REV2)
  potencia_teorica_kW: 0.320
  potencia_teorica_HP: 0.43
  potencia_instalada_HP: 0.75     # provisional; fijar con la selección de catálogo
  motor_instalado: "0.75 HP TEFC encapsulado anticorrosivo, en la corriente de aire (transmisión directa) — provisional, confirmar con catálogo"
  escenario_filtracion_diseno: "MERV 13-14 cargado (ΔP filtro 154 Pa + 11 Pa rejillas = 165 Pa total; sin presurización, REV1)"
  punto_catalogo_estandar: "Punto equivalente a rho = 1.2 kg/m³ para selección de ventilador: 3 840 m³/h @ 225 Pa (diseño), 95 Pa (limpio)"
  boca_geometria_modelo_cfd: "Círculo equivalente (equivalente hidráulico). La descarga real del axial queda definida por el diámetro del equipo seleccionado."
  escenarios_filtracion:
    - nombre: "MERV 13-14 limpio"
      dp_filtro_Pa: 59
      dp_vent_total_Pa: 70
      potencia_kW: 0.136
      potencia_HP: 0.18
      motor_HP: 0.5
    - nombre: "MERV 13-14 cargado (diseño)"
      dp_filtro_Pa: 154
      dp_vent_total_Pa: 165
      potencia_kW: 0.320
      potencia_HP: 0.43
      motor_HP: 0.75
    - nombre: "HEPA H13 limpio (referencia histórica — descartado, no aplica)"
      dp_filtro_Pa: 250
      dp_vent_total_Pa: 261
      potencia_kW: 0.506
      potencia_HP: 0.68
      motor_HP: 1.25
    - nombre: "HEPA H13 cargado (referencia histórica — descartado, no aplica)"
      dp_filtro_Pa: 600
      dp_vent_total_Pa: 611
      potencia_kW: 1.185
      potencia_HP: 1.59
      motor_HP: 2.5

# ---------------------------------------------------------------------
# Criterios de diseño de rejillas de exfiltración
# ---------------------------------------------------------------------
rejillas_exfiltracion:
  numero: 3
  velocidad_facial_m_s: 3.0
  area_neta_total_m2: 0.3556
  area_neta_por_rejilla_m2: 0.1185
  altura_mm: 353.2
  ancho_mm: 335.5
  proporcion_ancho_alto: 0.95
  perdida_descarga_Pa: 11.0       # pérdida a 3 m/s con C_d = 0.60 (rho = 0.88); descarga libre a atmósfera (REV1: sin presurización)

# ---------------------------------------------------------------------
# Normas aplicables vigentes
# ---------------------------------------------------------------------
normas:
  - codigo: "ASHRAE 170"
    edicion: "2021"
    alcance: "Ventilation of Health Care Facilities"
  - codigo: "ASHRAE 62.1"
    edicion: "2022"
    alcance: "Ventilation for Acceptable Indoor Air Quality"
  - codigo: "NFPA 99"
    edicion: "2021"
    alcance: "Health Care Facilities Code"
  - codigo: "OSHA 29 CFR 1910.1450"
    edicion: "2012"
    alcance: "Occupational Exposure to Hazardous Chemicals in Laboratories"
  - codigo: "WHO Laboratory Biosafety Manual"
    edicion: "2004"
    alcance: "Recomendaciones de renovaciones de aire para laboratorios BSL-2 y BSL-3"
  - codigo: "NIH DRM"
    edicion: "2023"
    alcance: "Design Requirements Manual"
  - codigo: "ASHRAE Handbook Fundamentals"
    edicion: "2021"
    alcance: "Coeficiente de descarga de orificios (mecánica de fluidos)"
  - codigo: "RETIE"
    edicion: "vigente"
    alcance: "Reglamento Técnico de Instalaciones Eléctricas (Colombia) — suministro y protección del motor"
  - codigo: "NTC 2050"
    edicion: "vigente"
    alcance: "Código eléctrico colombiano (equivalente NEC) — circuitos y protecciones"
  - codigo: "Resolución 0312/2019 MinSalud"
    edicion: "2019"
    alcance: "Habilitación de servicios de salud (aplica si el laboratorio los presta)"
